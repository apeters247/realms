# realmsoutthere.com — REALMS knowledge base
# Static Astro frontend served from disk; API proxied to Docker container.
#
# Install:
#   sudo cp /var/www/realms/nginx/realmsoutthere.com.conf /etc/nginx/sites-available/realmsoutthere.com
#   sudo ln -s /etc/nginx/sites-available/realmsoutthere.com /etc/nginx/sites-enabled/
#   sudo mkdir -p /var/www/certbot
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d realmsoutthere.com -d www.realmsoutthere.com
#   sudo systemctl reload nginx

# Redirect www → bare domain
server {
    listen 80;
    listen [::]:80;
    server_name www.realmsoutthere.com;
    return 301 https://realmsoutthere.com$request_uri;
}

# HTTP → HTTPS redirect + ACME challenge for certbot
server {
    listen 80;
    listen [::]:80;
    server_name realmsoutthere.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://realmsoutthere.com$request_uri;
    }
}

# Main HTTPS vhost
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name realmsoutthere.com;

    # SSL — populated by certbot
    ssl_certificate     /etc/letsencrypt/live/realmsoutthere.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/realmsoutthere.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    nosniff always;
    add_header X-Frame-Options           SAMEORIGIN always;
    add_header Referrer-Policy           strict-origin-when-cross-origin always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Proxy headers
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # Static Astro build served directly from disk (no Python hop)
    location /app/ {
        alias /var/www/realms/web-next/dist/;
        try_files $uri $uri/ $uri.html /app/index.html =404;

        # Hashed assets — immutable long cache
        location ~* \.(js|css|woff2?|ttf|svg|png|jpg|webp|ico|avif)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Content-Type-Options nosniff always;
        }
    }

    # Search index — serve from disk, bandwidth cap to discourage bulk scraping
    location = /app/search-index.json {
        alias /var/www/realms/web-next/dist/search-index.json;
        limit_rate 2m;
    }

    # Short permalinks (e.g. /e/42)
    location ~ ^/e/[0-9]+ {
        proxy_pass         http://127.0.0.1:8005;
        proxy_read_timeout 10s;
    }

    # API routes → Docker container
    location ~ ^/(entities|entity-classes|hierarchy|relationships|cultures|regions|sources|extractions|search|stats|metrics|graph|export|review|corroboration|timeline|external-links|integrity|feedback|collections|changelog|og|api)/ {
        proxy_pass         http://127.0.0.1:8005;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 1m;
    }

    # Root and catch-all → API (handles / → /app/ redirect, /docs, etc.)
    location / {
        proxy_pass         http://127.0.0.1:8005;
        proxy_read_timeout 30s;
    }

    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/realmsoutthere.com.access.log;
    error_log  /var/log/nginx/realmsoutthere.com.error.log warn;
}
