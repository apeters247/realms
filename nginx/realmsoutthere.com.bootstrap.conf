# realmsoutthere.com — HTTP bootstrap for certbot
server {
    listen 80;
    listen [::]:80;
    server_name www.realmsoutthere.com realmsoutthere.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /app/ {
        alias /var/www/realms/web-next/dist/;
        try_files $uri $uri/ $uri.html /app/index.html =404;
    }

    location ~ ^/e/[0-9]+ {
        proxy_pass http://127.0.0.1:8005;
        proxy_read_timeout 10s;
    }

    location ~ ^/(entities|entity-classes|hierarchy|relationships|cultures|regions|sources|extractions|search|stats|metrics|graph|export|review|corroboration|timeline|external-links|integrity|feedback|collections|changelog|og|api)/ {
        proxy_pass http://127.0.0.1:8005;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        client_max_body_size 1m;
    }

    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_read_timeout 30s;
    }
}
